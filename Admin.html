<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        background: #f3f7fb;
        color: #0b1f4d;
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }

      .card {
        background: #ffffff;
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 26px;
        line-height: 1.35;
        color: #061a46;
      }

      .subtitle {
        margin-bottom: 24px;
        color: #007f83;
        font-weight: 700;
      }

      .control-row {
        display: flex;
        gap: 12px;
        align-items: end;
        margin-bottom: 20px;
      }

      .control {
        flex: 1;
      }

      label {
        display: block;
        margin: 0 0 6px;
        font-weight: 700;
      }

      select, input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        font-size: 16px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: #fff;
      }

      button {
        padding: 12px 18px;
        font-size: 16px;
        font-weight: 700;
        color: white;
        background: #007f83;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        white-space: nowrap;
      }

      button:disabled {
        background: #94a3b8;
        cursor: not-allowed;
      }

      .summary-box {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 18px 0;
      }

      .summary-item {
        padding: 16px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
      }

      .summary-label {
        font-size: 13px;
        color: #64748b;
        font-weight: 700;
      }

      .summary-value {
        margin-top: 6px;
        font-size: 22px;
        font-weight: 800;
        color: #061a46;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 14px;
        overflow: hidden;
        border-radius: 12px;
      }

      th {
        background: #061a46;
        color: #ffffff;
        padding: 12px;
        text-align: left;
        font-size: 14px;
      }

      td {
        border-bottom: 1px solid #e2e8f0;
        padding: 12px;
        font-size: 14px;
      }

      tr:nth-child(even) td {
        background: #f8fafc;
      }

      .right {
        text-align: right;
      }

      .message {
        margin-top: 18px;
        padding: 14px;
        border-radius: 10px;
        font-weight: 700;
        display: none;
      }

      .info {
        display: block;
        background: #e6fffb;
        color: #0f766e;
      }

      .error {
        display: block;
        background: #fee2e2;
        color: #991b1b;
      }

      .empty {
        margin-top: 20px;
        padding: 18px;
        background: #fff7ed;
        color: #9a3412;
        border-radius: 12px;
        font-weight: 700;
        display: none;
      }

      .section-title {
        margin-top: 34px;
        padding-top: 24px;
        border-top: 2px solid #e2e8f0;
        font-size: 20px;
        font-weight: 800;
        color: #061a46;
      }

      .section-subtitle {
        margin-top: 6px;
        margin-bottom: 16px;
        color: #64748b;
        font-size: 14px;
        line-height: 1.6;
      }

      .history-controls {
        display: flex;
        gap: 12px;
        align-items: end;
        margin-top: 16px;
        margin-bottom: 16px;
      }

      .history-control {
        flex: 1;
      }

      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
      }

      .badge-ok {
        background: #dcfce7;
        color: #166534;
      }

      .badge-check {
        background: #fee2e2;
        color: #991b1b;
      }

      .history-summary {
        margin-top: 14px;
        padding: 14px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        font-weight: 700;
        display: none;
        line-height: 1.7;
      }

      .footer-link {
        margin-top: 22px;
        font-size: 14px;
      }

      .footer-link a {
        color: #007f83;
        font-weight: 700;
        text-decoration: none;
      }

      @media (max-width: 720px) {
        .control-row {
          flex-direction: column;
          align-items: stretch;
        }

        .history-controls {
          flex-direction: column;
          align-items: stretch;
        }

        .summary-box {
          grid-template-columns: 1fr;
        }

        table {
          font-size: 13px;
        }

        th, td {
          padding: 10px 8px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <h1>交通費精算 管理画面</h1>
        <div class="subtitle">月別の支給額一覧と部員別申請履歴を確認できます</div>

        <div class="section-title" style="margin-top: 0; padding-top: 0; border-top: none;">
          月別集計
        </div>
        <div class="section-subtitle">
          対象月を選ぶと、その月に誰へ何円支給すべきかを確認できます。
        </div>

        <div class="control-row">
          <div class="control">
            <label for="monthSelect">対象月</label>
            <select id="monthSelect">
              <option value="">選択してください</option>
            </select>
          </div>

          <button id="loadButton" type="button">集計を表示</button>
        </div>

        <div id="message" class="message"></div>

        <div id="summaryBox" class="summary-box" style="display: none;">
          <div class="summary-item">
            <div class="summary-label">対象月</div>
            <div class="summary-value" id="summaryMonth">-</div>
          </div>

          <div class="summary-item">
            <div class="summary-label">支給対象人数</div>
            <div class="summary-value" id="summaryPeople">0人</div>
          </div>

          <div class="summary-item">
            <div class="summary-label">支給額合計</div>
            <div class="summary-value" id="summaryTotalPayment">0円</div>
          </div>
        </div>

        <div id="emptyMessage" class="empty">
          この月の集計データはありません。
        </div>

        <table id="summaryTable" style="display: none;">
          <thead>
            <tr>
              <th>氏名</th>
              <th>学籍番号</th>
              <th class="right">合計対象距離km</th>
              <th class="right">支給額合計</th>
            </tr>
          </thead>
          <tbody id="summaryTableBody"></tbody>
        </table>

        <div class="section-title">部員別申請履歴</div>
        <div class="section-subtitle">
          対象月と氏名を選ぶと、その部員の申請内訳を確認できます。
        </div>

        <div class="history-controls">
          <div class="history-control">
            <label for="historyMonthSelect">対象月</label>
            <select id="historyMonthSelect">
              <option value="">選択してください</option>
            </select>
          </div>

          <div class="history-control">
            <label for="historyNameSelect">氏名</label>
            <select id="historyNameSelect">
              <option value="">対象月を先に選択してください</option>
            </select>
          </div>

          <button id="historyLoadButton" type="button">履歴を表示</button>
        </div>

        <div id="historyMessage" class="message"></div>

        <div id="historySummary" class="history-summary"></div>

        <table id="historyTable" style="display: none;">
          <thead>
            <tr>
              <th>申請日</th>
              <th>申請種別</th>
              <th>場所</th>
              <th>距離区分</th>
              <th class="right">対象距離km</th>
              <th class="right">支給額</th>
              <th>ステータス</th>
            </tr>
          </thead>
          <tbody id="historyTableBody"></tbody>
        </table>

        <div id="historyEmptyMessage" class="empty">
          この条件に該当する申請履歴はありません。
        </div>

        <div class="footer-link">
          <a href="#" id="backToFormLink">申請フォームに戻る</a>
        </div>
      </div>
    </div>

    <script>
      const monthSelect = document.getElementById('monthSelect');
      const loadButton = document.getElementById('loadButton');
      const message = document.getElementById('message');
      const summaryBox = document.getElementById('summaryBox');
      const summaryMonth = document.getElementById('summaryMonth');
      const summaryPeople = document.getElementById('summaryPeople');
      const summaryTotalPayment = document.getElementById('summaryTotalPayment');
      const summaryTable = document.getElementById('summaryTable');
      const summaryTableBody = document.getElementById('summaryTableBody');
      const emptyMessage = document.getElementById('emptyMessage');
      const backToFormLink = document.getElementById('backToFormLink');

      const historyMonthSelect = document.getElementById('historyMonthSelect');
      const historyNameSelect = document.getElementById('historyNameSelect');
      const historyLoadButton = document.getElementById('historyLoadButton');
      const historyMessage = document.getElementById('historyMessage');
      const historySummary = document.getElementById('historySummary');
      const historyTable = document.getElementById('historyTable');
      const historyTableBody = document.getElementById('historyTableBody');
      const historyEmptyMessage = document.getElementById('historyEmptyMessage');

      function showMessage(text, type) {
        message.textContent = text;
        message.className = 'message ' + type;
      }

      function clearMessage() {
        message.textContent = '';
        message.className = 'message';
      }

      function showHistoryMessage(text, type) {
        historyMessage.textContent = text;
        historyMessage.className = 'message ' + type;
      }

      function clearHistoryMessage() {
        historyMessage.textContent = '';
        historyMessage.className = 'message';
      }

      function formatYen(value) {
        return Number(value || 0).toLocaleString() + '円';
      }

      function formatKm(value) {
        return Number(value || 0).toLocaleString(undefined, {
          minimumFractionDigits: 0,
          maximumFractionDigits: 1
        });
      }

      function resetView() {
        summaryBox.style.display = 'none';
        summaryTable.style.display = 'none';
        emptyMessage.style.display = 'none';
        summaryTableBody.innerHTML = '';
      }

      function resetHistoryView() {
        historySummary.style.display = 'none';
        historyTable.style.display = 'none';
        historyEmptyMessage.style.display = 'none';
        historyTableBody.innerHTML = '';
      }

      function populateMonths(months) {
        monthSelect.innerHTML = '<option value="">選択してください</option>';

        months.forEach(month => {
          const option = document.createElement('option');
          option.value = month;
          option.textContent = month;
          monthSelect.appendChild(option);
        });

        if (months.length > 0) {
          monthSelect.value = months[0];
        }
      }

      function populateHistoryMonths(months) {
        historyMonthSelect.innerHTML = '<option value="">選択してください</option>';

        months.forEach(month => {
          const option = document.createElement('option');
          option.value = month;
          option.textContent = month;
          historyMonthSelect.appendChild(option);
        });

        if (months.length > 0) {
          historyMonthSelect.value = months[0];
          loadHistoryNames(months[0]);
        }
      }

      function loadHistoryNames(month) {
        historyNameSelect.innerHTML = '<option value="">読み込み中...</option>';
        resetHistoryView();
        clearHistoryMessage();

        if (!month) {
          historyNameSelect.innerHTML = '<option value="">対象月を先に選択してください</option>';
          return;
        }

        google.script.run
          .withSuccessHandler(names => {
            historyNameSelect.innerHTML = '<option value="">選択してください</option>';

            names.forEach(name => {
              const option = document.createElement('option');
              option.value = name;
              option.textContent = name;
              historyNameSelect.appendChild(option);
            });

            if (names.length === 0) {
              historyNameSelect.innerHTML = '<option value="">申請者がいません</option>';
            }
          })
          .withFailureHandler(error => {
            historyNameSelect.innerHTML = '<option value="">読み込み失敗</option>';
            showHistoryMessage('氏名候補の読み込みに失敗しました：' + error.message, 'error');
          })
          .getHistoryNamesForWeb(month);
      }

      function renderSummary(rows, month) {
        resetView();

        if (!rows || rows.length === 0) {
          emptyMessage.style.display = 'block';
          return;
        }

        let totalPayment = 0;
        let totalKm = 0;

        rows.forEach(row => {
          totalPayment += Number(row.totalPayment) || 0;
          totalKm += Number(row.totalKm) || 0;

          const tr = document.createElement('tr');

          tr.innerHTML = `
            <td>${row.name}</td>
            <td>${row.studentId || ''}</td>
            <td class="right">${formatKm(row.totalKm)}</td>
            <td class="right">${formatYen(row.totalPayment)}</td>
          `;

          summaryTableBody.appendChild(tr);
        });

        summaryMonth.textContent = month;
        summaryPeople.textContent = rows.length + '人';
        summaryTotalPayment.textContent = formatYen(totalPayment);

        summaryBox.style.display = 'grid';
        summaryTable.style.display = 'table';
      }

      function renderHistory(rows, month, name) {
        resetHistoryView();

        if (!rows || rows.length === 0) {
          historyEmptyMessage.style.display = 'block';
          return;
        }

        let totalKm = 0;
        let totalPayment = 0;

        rows.forEach(row => {
          totalKm += Number(row.targetKm) || 0;
          totalPayment += Number(row.payment) || 0;

          const statusClass = row.status === 'OK' ? 'badge-ok' : 'badge-check';

          const tr = document.createElement('tr');

          tr.innerHTML = `
            <td>${row.applicationDate || ''}</td>
            <td>${row.applicationType || ''}</td>
            <td>${row.place || ''}</td>
            <td>${row.distanceType || ''}</td>
            <td class="right">${formatKm(row.targetKm)}</td>
            <td class="right">${formatYen(row.payment)}</td>
            <td><span class="badge ${statusClass}">${row.status || ''}</span></td>
          `;

          historyTableBody.appendChild(tr);
        });

        historySummary.textContent =
          `${month} / ${name}：${rows.length}件、合計距離 ${formatKm(totalKm)}km、支給額合計 ${formatYen(totalPayment)}`;

        historySummary.style.display = 'block';
        historyTable.style.display = 'table';
      }

      google.script.run
        .withSuccessHandler(months => {
          populateMonths(months);
          populateHistoryMonths(months);
        })
        .withFailureHandler(error => {
          showMessage('月の候補の読み込みに失敗しました：' + error.message, 'error');
        })
        .getAvailableMonthsForWeb();

      loadButton.addEventListener('click', () => {
        clearMessage();
        resetView();

        const month = monthSelect.value;

        if (!month) {
          showMessage('対象月を選択してください。', 'error');
          return;
        }

        loadButton.disabled = true;
        loadButton.textContent = '読み込み中...';

        google.script.run
          .withSuccessHandler(rows => {
            loadButton.disabled = false;
            loadButton.textContent = '集計を表示';
            renderSummary(rows, month);
          })
          .withFailureHandler(error => {
            loadButton.disabled = false;
            loadButton.textContent = '集計を表示';
            showMessage('集計の読み込みに失敗しました：' + error.message, 'error');
          })
          .getMonthlySummaryForWeb(month);
      });

      historyMonthSelect.addEventListener('change', () => {
        const month = historyMonthSelect.value;
        loadHistoryNames(month);
      });

      historyLoadButton.addEventListener('click', () => {
        clearHistoryMessage();
        resetHistoryView();

        const month = historyMonthSelect.value;
        const name = historyNameSelect.value;

        if (!month) {
          showHistoryMessage('対象月を選択してください。', 'error');
          return;
        }

        if (!name) {
          showHistoryMessage('氏名を選択してください。', 'error');
          return;
        }

        historyLoadButton.disabled = true;
        historyLoadButton.textContent = '読み込み中...';

        google.script.run
          .withSuccessHandler(rows => {
            historyLoadButton.disabled = false;
            historyLoadButton.textContent = '履歴を表示';
            renderHistory(rows, month, name);
          })
          .withFailureHandler(error => {
            historyLoadButton.disabled = false;
            historyLoadButton.textContent = '履歴を表示';
            showHistoryMessage('申請履歴の読み込みに失敗しました：' + error.message, 'error');
          })
          .getApplicationHistoryForWeb(month, name);
      });

      backToFormLink.addEventListener('click', event => {
        event.preventDefault();

        const url = window.location.href.split('?')[0];
        window.location.href = url;
      });
    </script>
  </body>
</html>
